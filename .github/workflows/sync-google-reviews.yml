name: Sync Google Reviews

on:
  schedule:
    # 每天台北時間早上 9:00（UTC 01:00）執行一次
    - cron: "0 1 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: standalone

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync Google rating/review count
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: node scripts/sync-google-reviews.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- client/src/data/googleReviews.json; then
            echo "沒有變動，跳過 commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add client/src/data/googleReviews.json
          git commit -m "chore: 自動同步 Google 評分/評論數"
          git push origin standalone
